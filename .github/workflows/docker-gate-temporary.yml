name: TEMP Docker validation — Vite migration
on:
  push:
    branches:
      - codex/vite-migration
    paths:
      - '.github/workflows/docker-gate-temporary.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
permissions:
  contents: read
concurrency:
  group: docker-gate-vite-migration
  cancel-in-progress: false
jobs:
  docker-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate container
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/docker-gate-evidence"
          mkdir -p "$EVIDENCE"
          exec > >(tee "$EVIDENCE/run.log") 2>&1
          IMAGE="sm-vite-docker-gate:$GITHUB_SHA"
          APP="sm-vite-app-$GITHUB_RUN_ID"
          MONGO="sm-vite-mongo-$GITHUB_RUN_ID"
          NET="sm-vite-net-$GITHUB_RUN_ID"
          INSPECT="sm-vite-inspect-$GITHUB_RUN_ID"
          FAILED=0
          cleanup() {
            if docker ps -a --format '{{.Names}}' | grep -Fxq "$APP"; then
              docker logs "$APP" > "$EVIDENCE/container-runtime.log" 2>&1 || true
            fi
            docker rm -f "$APP" "$MONGO" "$INSPECT" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" | tee "$EVIDENCE/identity.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/codex/vite-migration"
          docker version | tee "$EVIDENCE/docker-version.txt"
          docker info | tee "$EVIDENCE/docker-info.txt"
          if docker build --pull --no-cache --file Dockerfile --tag "$IMAGE" . 2>&1 | tee "$EVIDENCE/docker-build.log"; then
            echo 'DOCKER_BUILD=PASS' | tee -a "$EVIDENCE/results.txt"
          else
            echo 'DOCKER_BUILD=FAIL' | tee -a "$EVIDENCE/results.txt"
            exit 1
          fi
          mapfile -t EXPOSED < <(docker image inspect "$IMAGE" --format '{{range $port, $_ := .Config.ExposedPorts}}{{println $port}}{{end}}' | sed '/^[[:space:]]*$/d')
          test "${#EXPOSED[@]}" -eq 1
          [[ "${EXPOSED[0]}" =~ ^([0-9]+)/tcp$ ]]
          CONTAINER_PORT="${BASH_REMATCH[1]}"
          printf 'container_port=%s (from image ExposedPorts)\n' "$CONTAINER_PORT" | tee "$EVIDENCE/port.txt"
          docker network create "$NET" >/dev/null
          docker run -d --name "$MONGO" --network "$NET" --network-alias mongo mongo:7.0 --bind_ip_all
          MONGO_READY=0
          for _ in $(seq 1 60); do
            if docker exec "$MONGO" mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then MONGO_READY=1; break; fi
            sleep 2
          done
          test "$MONGO_READY" -eq 1
          docker run -d --name "$APP" --network "$NET" -p "127.0.0.1::${CONTAINER_PORT}" \
            -e "PORT=$CONTAINER_PORT" \
            -e 'MONGO_URL=mongodb://mongo:27017/sm_docker_gate' \
            -e 'DB_NAME=sm_docker_gate' \
            -e 'JWT_SECRET=temporary-docker-gate-only-not-production' \
            "$IMAGE"
          HOST_MAPPING="$(docker port "$APP" "$CONTAINER_PORT/tcp" | head -n 1)"
          HOST_PORT="${HOST_MAPPING##*:}"
          BASE_URL="http://127.0.0.1:$HOST_PORT"
          printf 'host_mapping=%s\n' "$HOST_MAPPING" | tee -a "$EVIDENCE/port.txt"
          READY=0
          for _ in $(seq 1 60); do
            STATUS="$(curl -sS -o "$EVIDENCE/index.html" -w '%{http_code}' --max-time 4 "$BASE_URL/" 2>/dev/null || true)"
            if [ "$STATUS" = 200 ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" -eq 1
          echo "HTTP_200=root:PASS ($STATUS)" | tee -a "$EVIDENCE/results.txt"
          HEALTH="$(curl -sS -o "$EVIDENCE/health.json" -w '%{http_code}' --max-time 10 "$BASE_URL/health")"
          test "$HEALTH" = 200
          echo "HTTP_200=health:PASS ($HEALTH)" | tee -a "$EVIDENCE/results.txt"
          export BASE_URL
          python3 - <<'PY' | tee "$EVIDENCE/assets.log"
          import os
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen
          base = os.environ["BASE_URL"] + "/"
          html = open(os.path.join(os.environ["RUNNER_TEMP"], "docker-gate-evidence", "index.html"), encoding="utf-8").read()
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ("src","href"):
                      value=attrs.get(key,"")
                      if value and (".js" in value or ".css" in value):
                          self.urls.append(value)
          parser=Assets(); parser.feed(html)
          urls=list(dict.fromkeys(parser.urls))
          assert urls, "No JS/CSS assets referenced by root HTML"
          kinds={"js":0,"css":0}
          for item in urls:
              target=urljoin(base,item)
              with urlopen(target,timeout=15) as response:
                  assert response.status==200, f"asset status {response.status}"
                  path=urlparse(target).path.lower()
                  if ".js" in path: kinds["js"]+=1
                  if ".css" in path: kinds["css"]+=1
                  print(f"asset_http=200 type={path.rsplit('.',1)[-1]} path=[redacted]")
          assert kinds["js"]>0, "No JavaScript bundle loaded"
          assert kinds["css"]>0, "No CSS bundle loaded"
          print(f"ASSETS=PASS js={kinds['js']} css={kinds['css']}")
          PY
          echo 'ASSETS=PASS' | tee -a "$EVIDENCE/results.txt"
          DEEP="$(curl -sS -o "$EVIDENCE/deep-route.html" -w '%{http_code}' --max-time 10 "$BASE_URL/settings")"
          test "$DEEP" = 200
          cmp -s "$EVIDENCE/index.html" "$EVIDENCE/deep-route.html"
          echo 'DEEP_ROUTES=PASS /settings returns the SPA entry document' | tee -a "$EVIDENCE/results.txt"
          docker create --name "$INSPECT" "$IMAGE" >/dev/null
          mkdir -p "$EVIDENCE/dist-inspection"
          docker cp "$INSPECT:/app/frontend/dist/." "$EVIDENCE/dist-inspection/"
          docker rm "$INSPECT" >/dev/null
          SETTINGS_RESULT="$(python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          source=Path("frontend/src/features/settings/SettingsPage.js").read_text(encoding="utf-8")
          dockerfile=Path("Dockerfile").read_text(encoding="utf-8")
          direct="import.meta.env.VITE_BACKEND_URL" in source
          injected=bool(re.search(r"(?m)^\s*(ARG|ENV)\s+VITE_BACKEND_URL\b", dockerfile))
          dist=Path(os.environ["RUNNER_TEMP"],"docker-gate-evidence","dist-inspection")
          bundles=list(dist.rglob("*.js"))
          unresolved=any("undefined/api/user/profile" in p.read_text(encoding="utf-8",errors="ignore") for p in bundles)
          print("PASS" if not direct or (injected and not unresolved) else f"FAIL:injected={injected}:unresolved={unresolved}")
          PY
          )"
          rm -rf "$EVIDENCE/dist-inspection"
          echo "SETTINGS_BACKEND_URL=$SETTINGS_RESULT (value not emitted)" | tee -a "$EVIDENCE/results.txt"
          if [ "$SETTINGS_RESULT" != PASS ]; then
            echo 'SettingsPage reads VITE_BACKEND_URL directly, but the Dockerfile has no build-time injection for it.' | tee "$EVIDENCE/settings-backend-url.txt"
            FAILED=1
          fi
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock playwright@1.55.0 2>&1 | tee "$EVIDENCE/browser-tool-install.log"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$EVIDENCE/browser-install.log"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs"
          node --input-type=module <<'NODE' | tee "$EVIDENCE/browser-smoke.log"
          const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[];
          page.on("pageerror", e => errors.push(e.message));
          page.on("console", m => { if(m.type()==="error") errors.push(m.text().replace(/https?:\/\/\S+/g,"[URL]")); });
          const root=await page.goto(process.env.BASE_URL+"/",{waitUntil:"networkidle",timeout:45000});
          if(!root || root.status()!==200) throw new Error("root browser navigation did not return HTTP 200");
          if(!(await page.locator("#root").count())) throw new Error("React root missing");
          if(!(await page.locator("#root").innerText()).trim()) throw new Error("React root rendered blank");
          const deep=await page.goto(process.env.BASE_URL+"/settings",{waitUntil:"networkidle",timeout:45000});
          if(!deep || deep.status()!==200) throw new Error("deep route browser navigation did not return HTTP 200");
          if(errors.length) throw new Error("browser runtime errors: "+errors.join(" | "));
          console.log("BROWSER_ROOT=PASS");
          console.log("BROWSER_DEEP_ROUTE=PASS");
          console.log("RUNTIME_ERRORS=NONE");
          await browser.close();
          NODE
          echo 'CONTAINER_START=PASS' | tee -a "$EVIDENCE/results.txt"
          docker logs "$APP" > "$EVIDENCE/container-runtime.log" 2>&1
          if grep -Eiq 'Traceback|FATAL|Unhandled exception|Application startup failed' "$EVIDENCE/container-runtime.log"; then
            echo 'RUNTIME_ERRORS=FOUND' | tee -a "$EVIDENCE/results.txt"
            FAILED=1
          else
            echo 'RUNTIME_ERRORS=NONE' | tee -a "$EVIDENCE/results.txt"
          fi
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo 'REMOTE_DOCKER_GATE=PASS' | tee -a "$EVIDENCE/results.txt"
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/docker-gate-evidence"
          if [ -d "$EVIDENCE" ]; then
            find "$EVIDENCE" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE/SHA256SUMS"
            cat "$EVIDENCE/SHA256SUMS"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-gate-${{ github.sha }}
          path: ${{ runner.temp }}/docker-gate-evidence/
          if-no-files-found: warn
          retention-days: 14
